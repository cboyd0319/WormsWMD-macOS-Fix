<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="190" viewBox="0 0 1100 190" role="img" aria-labelledby="title desc">
  <title id="title">Worms W.M.D macOS Fix 1998 chaos banner</title>
  <desc id="desc">A deliberately loud retro web banner for the community macOS fix.</desc>
  <defs>
    <linearGradient id="hot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff00ff"/>
      <stop offset="0.22" stop-color="#00ffff"/>
      <stop offset="0.45" stop-color="#ffff00"/>
      <stop offset="0.7" stop-color="#00ff33"/>
      <stop offset="1" stop-color="#ff3300"/>
    </linearGradient>
    <pattern id="checker" width="28" height="28" patternUnits="userSpaceOnUse">
      <rect width="14" height="14" fill="#000"/>
      <rect x="14" y="14" width="14" height="14" fill="#000"/>
      <rect x="14" width="14" height="14" fill="#fff"/>
      <rect y="14" width="14" height="14" fill="#fff"/>
    </pattern>
    <filter id="chunky-shadow">
      <feDropShadow dx="7" dy="7" stdDeviation="0" flood-color="#000"/>
    </filter>
  </defs>
  <rect width="1100" height="190" fill="url(#checker)"/>
  <rect x="18" y="18" width="1064" height="154" fill="url(#hot)" stroke="#000" stroke-width="10"/>
  <rect x="36" y="36" width="1028" height="118" fill="#000" opacity="0.82" stroke="#fff" stroke-width="5" stroke-dasharray="18 10"/>
  <g font-family="Impact, Arial Black, Helvetica, sans-serif" text-anchor="middle" filter="url(#chunky-shadow)">
    <text x="550" y="84" font-size="50" fill="#ffff00" stroke="#ff00ff" stroke-width="2">WORMS W.M.D MACOS FIX</text>
    <text x="550" y="132" font-size="34" fill="#00ffff">BLACK SCREEN? PRESS 1. RETURN TO MAYHEM.</text>
  </g>
  <g font-family="Courier New, monospace" font-size="18" font-weight="700" fill="#fff">
    <text x="50" y="165">BEST VIEWED WITH MAXIMUM CONFIDENCE</text>
    <text x="790" y="165">NO SUDO // BACKUPS FIRST</text>
  </g>
</svg>
