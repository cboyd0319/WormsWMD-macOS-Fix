<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="180" viewBox="0 0 1100 180" role="img" aria-labelledby="title desc">
  <title id="title">Retro button wall</title>
  <desc id="desc">A wall of loud fake web buttons for the Worms W.M.D macOS fix.</desc>
  <rect width="1100" height="180" fill="#26006b"/>
  <g font-family="Arial Black, Impact, Helvetica, sans-serif" font-size="20" text-anchor="middle">
    <g transform="translate(28 24)">
      <rect width="188" height="44" fill="#ff00ff" stroke="#fff" stroke-width="4"/><text x="94" y="30" fill="#fff">PRESS 1</text>
    </g>
    <g transform="translate(236 24)">
      <rect width="188" height="44" fill="#00ffff" stroke="#000" stroke-width="4"/><text x="94" y="30" fill="#000">NO SUDO</text>
    </g>
    <g transform="translate(444 24)">
      <rect width="188" height="44" fill="#ffff00" stroke="#000" stroke-width="4"/><text x="94" y="30" fill="#000">BACKUPS</text>
    </g>
    <g transform="translate(652 24)">
      <rect width="188" height="44" fill="#00ff33" stroke="#000" stroke-width="4"/><text x="94" y="30" fill="#000">QT 5.15</text>
    </g>
    <g transform="translate(860 24)">
      <rect width="188" height="44" fill="#ff3300" stroke="#fff" stroke-width="4"/><text x="94" y="30" fill="#fff">AGL STUB</text>
    </g>
    <g transform="translate(132 104)">
      <rect width="188" height="44" fill="#ffffff" stroke="#ff00ff" stroke-width="4"/><text x="94" y="30" fill="#ff00ff">STEAM HELP</text>
    </g>
    <g transform="translate(340 104)">
      <rect width="188" height="44" fill="#111" stroke="#00ff00" stroke-width="4"/><text x="94" y="30" fill="#00ff00">DIAGNOSTICS</text>
    </g>
    <g transform="translate(548 104)">
      <rect width="188" height="44" fill="#0033ff" stroke="#fff" stroke-width="4"/><text x="94" y="30" fill="#fff">RESTORE</text>
    </g>
    <g transform="translate(756 104)">
      <rect width="188" height="44" fill="#ff9900" stroke="#000" stroke-width="4"/><text x="94" y="30" fill="#000">PLAY AGAIN</text>
    </g>
  </g>
</svg>
