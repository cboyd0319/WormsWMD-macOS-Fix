name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # actions/checkout v6.0.3
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Run ShellCheck
        # ludeeus/action-shellcheck 2.0.0
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38
        with:
          scandir: '.'
          severity: warning
        env:
          SHELLCHECK_OPTS: -e SC2034 -e SC1091

  validate-scripts:
    name: Validate Scripts
    runs-on: macos-latest
    steps:
      - name: Checkout
        # actions/checkout v6.0.3
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Check bash syntax
        run: |
          echo "Checking bash syntax..."
          for script in fix_worms_wmd.sh install.sh "Install Fix.command" "Worms W.M.D Fix.command" scripts/*.sh tools/*.sh; do
            if [[ -f "$script" ]]; then
              echo "  Checking $script"
              bash -n "$script"
            fi
          done
          echo "All scripts have valid syntax!"

      - name: Validate agent harness docs
        run: ./tools/validate_harness.sh

      - name: Test bootstrap installer safety
        run: ./tools/test_bootstrap_installer_safety.sh

      - name: Test dependency parsing
        run: ./tools/test_dependency_parsing.sh

      - name: Test issue 10 regression
        run: ./tools/test_issue_10_regression.sh

      - name: Test issue 11 game detection
        run: ./tools/test_issue_11_game_detection.sh

      - name: Test issue 12 AGL install failure
        run: ./tools/test_issue_12_agl_install_failure.sh

      - name: Test installer rollback regression
        run: ./tools/test_installer_rollback_regression.sh

      - name: Test mutation safety regression
        run: ./tools/test_mutation_safety.sh

      - name: Test support bundle sanitization
        run: ./tools/test_support_bundle_sanitization.sh

      - name: Test save backup regression
        run: ./tools/test_backup_saves_regression.sh

      - name: Test launcher friction regression
        run: ./tools/test_launcher_friction.sh

      - name: Test preflight regression
        run: ./tools/test_preflight_regression.sh

      - name: Test manifest regression
        run: ./tools/test_manifest_regression.sh

      - name: Test Qt version pinning
        run: ./tools/test_qt_version_pinning.sh

      - name: Check script permissions
        run: |
          echo "Verifying scripts are executable..."
          chmod +x fix_worms_wmd.sh install.sh "Install Fix.command" "Worms W.M.D Fix.command" scripts/*.sh tools/*.sh
          echo "Done!"

      - name: Test --help flag
        run: |
          ./fix_worms_wmd.sh --help

      - name: Build release bundle smoke test
        run: |
          ./tools/build_release_bundle.sh --version ci --skip-zip

  validate-c-code:
    name: Validate C Code
    runs-on: macos-latest
    steps:
      - name: Checkout
        # actions/checkout v6.0.3
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Check AGL stub compiles
        run: |
          echo "Compiling AGL stub..."
          clang -Wall -Wextra -Werror -arch x86_64 \
            -dynamiclib \
            -o /tmp/AGL_test \
            -framework OpenGL \
            src/agl_stub.c
          echo "AGL stub compiles successfully!"
          file /tmp/AGL_test
          rm /tmp/AGL_test
