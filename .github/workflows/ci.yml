name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      macos-required: ${{ steps.changes.outputs.macos-required }}
    steps:
      - name: Checkout
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run ShellCheck
        # ludeeus/action-shellcheck 2.0.0
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38
        with:
          scandir: '.'
          severity: warning
          version: v0.11.0
        env:
          SHELLCHECK_OPTS: -e SC2034 -e SC1091

      - name: Validate agent harness docs
        run: |
          ./tools/validate_harness.sh
          ./tools/test_harness_security.sh
          ./tools/test_sensitive_change_report.sh

      - name: Test GitHub security policy
        run: ./tools/test_github_security.sh

      - name: Test CI change classification
        run: ./tools/test_ci_change_classification.sh

      - name: Test CI changed-path selection
        run: ./tools/test_ci_changed_paths.sh

      - name: Test release SBOM generation
        run: python3 tools/test_generate_sbom.py

      - name: Test bounded archive inspection
        run: /usr/bin/python3 tools/test_archive_inspector.py
      - name: Test Homebrew bottle safety
        run: ruby tools/test_fetch_qt_homebrew_bottles.rb
      - name: Test enforced Git hooks
        run: ./tools/test_git_hooks.sh

      - name: Report security-sensitive changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: ./tools/report_sensitive_changes.sh "$EVENT_NAME" "$BASE_SHA" "$HEAD_SHA"

      - name: Classify macOS validation scope
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          changed_paths="$RUNNER_TEMP/wormswmd-changed-paths"
          if ! ./tools/ci_changed_paths.sh \
              "$EVENT_NAME" "$BASE_SHA" "$HEAD_SHA" > "$changed_paths"; then
            echo "macos-required=true" >> "$GITHUB_OUTPUT"
          elif ./tools/ci_requires_macos.sh < "$changed_paths"; then
            echo "macos-required=true" >> "$GITHUB_OUTPUT"
          else
            echo "macos-required=false" >> "$GITHUB_OUTPUT"
          fi

  validate-scripts:
    name: Validate Scripts
    needs: shellcheck
    if: needs.shellcheck.outputs.macos-required == 'true'
    runs-on: macos-26-intel
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Check bash syntax
        run: |
          echo "Checking bash syntax..."
          for script in fix_worms_wmd.sh install.sh "Install Fix.command" "Worms W.M.D Fix.command" scripts/*.sh tools/*.sh; do
            if [[ -f "$script" ]]; then
              echo "  Checking $script"
              bash -n "$script"
            fi
          done
          echo "All scripts have valid syntax!"

      - name: Compile AGL stub
        run: |
          clang -Wall -Wextra -Werror -arch x86_64 \
            -dynamiclib \
            -o /tmp/AGL_test \
            -framework OpenGL \
            src/agl_stub.c
          file /tmp/AGL_test
          rm /tmp/AGL_test

      - name: Test bootstrap installer safety
        run: ./tools/test_bootstrap_installer_safety.sh

      - name: Test dependency parsing
        run: ./tools/test_dependency_parsing.sh

      - name: Test issue 10 regression
        run: ./tools/test_issue_10_regression.sh

      - name: Test issue 11 game detection
        run: ./tools/test_issue_11_game_detection.sh

      - name: Test issue 12 AGL install failure
        run: ./tools/test_issue_12_agl_install_failure.sh

      - name: Test installer rollback regression
        run: ./tools/test_installer_rollback_regression.sh

      - name: Test mutation safety regression
        run: ./tools/test_mutation_safety.sh

      - name: Test support bundle sanitization
        run: ./tools/test_support_bundle_sanitization.sh

      - name: Test save backup regression
        run: ./tools/test_backup_saves_regression.sh

      - name: Test launcher friction regression
        run: ./tools/test_launcher_friction.sh

      - name: Test preflight regression
        run: ./tools/test_preflight_regression.sh
      - name: Test signature verification
        run: ./tools/test_signature_verification.sh
      - name: Test update download safety
        run: ./tools/test_update_download_safety.sh
      - name: Test manifest regression
        run: ./tools/test_manifest_regression.sh
      - name: Test Qt cache integrity
        run: ./tools/test_qt_cache_integrity.sh
      - name: Test Qt version pinning
        run: ./tools/test_qt_version_pinning.sh
      - name: Check script permissions
        run: |
          echo "Verifying scripts are executable..."
          chmod +x fix_worms_wmd.sh install.sh "Install Fix.command" "Worms W.M.D Fix.command" scripts/*.sh tools/*.sh
          echo "Done!"
      - name: Test --help flag
        run: |
          ./fix_worms_wmd.sh --help
      - name: Build release bundle smoke test
        run: |
          ./tools/build_release_bundle.sh --version ci --skip-zip
