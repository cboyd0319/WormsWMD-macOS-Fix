name: Release Bundle

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-release:
    name: Build release bundle
    runs-on: macos-26-intel

    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - name: Checkout
        # actions/checkout v7.0.0
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Make scripts executable
        run: chmod +x fix_worms_wmd.sh install.sh "Install Fix.command" "Worms W.M.D Fix.command" scripts/*.sh tools/*.sh

      - name: Validate harness
        run: ./tools/validate_harness.sh

      - name: Check bash syntax
        run: |
          for script in fix_worms_wmd.sh install.sh "Install Fix.command" "Worms W.M.D Fix.command" scripts/*.sh tools/*.sh; do
            bash -n "$script"
          done

      - name: Check Qt package
        run: ./scripts/download_qt_frameworks.sh --check

      - name: Compute release names
        id: release_names
        shell: bash
        run: |
          ref_name="${GITHUB_REF_NAME:-manual}"
          safe_ref="${ref_name//[^A-Za-z0-9._-]/-}"
          if [[ -z "$safe_ref" || "$safe_ref" == "." || "$safe_ref" == ".." ]]; then
            safe_ref="manual"
          fi
          echo "version=$safe_ref" >> "$GITHUB_OUTPUT"
          echo "artifact=WormsWMD-macOS-Fix-$safe_ref" >> "$GITHUB_OUTPUT"

      - name: Build release zip
        run: ./tools/build_release_bundle.sh --version "${{ steps.release_names.outputs.version }}"

      - name: Attest release assets
        # actions/attest v4.1.1
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763
        with:
          subject-path: |
            build/release/WormsWMD-macOS-Fix-*.zip
            build/release/WormsWMD-macOS-Fix-*.zip.sha256

      - name: Upload workflow artifact
        # actions/upload-artifact v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.release_names.outputs.artifact }}
          path: |
            build/release/WormsWMD-macOS-Fix-*.zip
            build/release/WormsWMD-macOS-Fix-*.zip.sha256

      - name: Publish GitHub release assets
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" build/release/*.zip build/release/*.zip.sha256 --clobber
          else
            gh release create "$GITHUB_REF_NAME" build/release/*.zip build/release/*.zip.sha256 --verify-tag --generate-notes
          fi
