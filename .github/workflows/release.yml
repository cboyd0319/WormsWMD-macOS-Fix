name: Release Bundle
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
permissions: {}
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build-release:
    name: Build release bundle
    runs-on: macos-26-intel
    timeout-minutes: 20
    permissions:
      contents: read # Read the exact source, changelog, and Qt evidence.
    outputs:
      artifact-name: ${{ steps.release_names.outputs.artifact }}
      version: ${{ steps.release_names.outputs.version }}
    steps:
      - name: Checkout
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Make scripts executable
        run: chmod +x fix_worms_wmd.sh install.sh "Install Fix.command" "Worms W.M.D Fix.command" scripts/*.sh tools/*.sh
      - name: Validate harness
        run: ./tools/validate_harness.sh
      - name: Check bash syntax
        run: |
          for script in fix_worms_wmd.sh install.sh "Install Fix.command" "Worms W.M.D Fix.command" scripts/*.sh tools/*.sh; do
            bash -n "$script"
          done
      - name: Check Qt package
        run: ./scripts/download_qt_frameworks.sh --check
      - name: Compute release names
        id: release_names
        shell: bash
        run: |
          ref_name="${GITHUB_REF_NAME:-manual}"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            [[ "$ref_name" =~ ^v[0-9]+[.][0-9]+[.][0-9]+$ ]]
            release_version=$(sed -nE 's/^VERSION="([^"]+)"$/\1/p' fix_worms_wmd.sh)
            [[ "$ref_name" == "v$release_version" ]]
          fi
          safe_ref="${ref_name//[^A-Za-z0-9._-]/-}"
          if [[ -z "$safe_ref" || "$safe_ref" == "." || "$safe_ref" == ".." ]]; then
            safe_ref="manual"
          fi
          echo "version=$safe_ref" >> "$GITHUB_OUTPUT"
          echo "artifact=WormsWMD-macOS-Fix-$safe_ref" >> "$GITHUB_OUTPUT"
      - name: Build release zip
        env:
          RELEASE_VERSION: ${{ steps.release_names.outputs.version }}
        run: |
          release_timestamp=$(git show -s --format=%cI HEAD)
          ./tools/build_release_bundle.sh --version "$RELEASE_VERSION" \
            --timestamp "$release_timestamp"
      - name: Prepare release notes
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_VERSION: ${{ steps.release_names.outputs.version }}
        run: ./tools/extract_release_notes.sh "${RELEASE_VERSION#v}" > build/release/RELEASE_NOTES.md
      - name: Generate release SBOM
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_VERSION: ${{ steps.release_names.outputs.version }}
        run: |
          release_timestamp=$(git show -s --format=%cI "$GITHUB_REF^{commit}")
          python3 tools/generate_sbom.py \
            --version "$RELEASE_VERSION" \
            --timestamp "$release_timestamp" \
            --archive "dist/qt-frameworks-x86_64-5.15.19.tar.gz" \
            --release-archive "build/release/WormsWMD-macOS-Fix-${RELEASE_VERSION}.zip" \
            --release-checksum "build/release/WormsWMD-macOS-Fix-${RELEASE_VERSION}.zip.sha256" \
            --output "build/release/WormsWMD-macOS-Fix-${RELEASE_VERSION}.cdx.json"
      - name: Upload read-only workflow artifact
        # actions/upload-artifact v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.release_names.outputs.artifact }}
          retention-days: 14
          path: |
            build/release/WormsWMD-macOS-Fix-*.zip
            build/release/WormsWMD-macOS-Fix-*.zip.sha256
            build/release/WormsWMD-macOS-Fix-*.cdx.json
            build/release/RELEASE_NOTES.md
  verify-release:
    name: Reverify tagged release
    needs: build-release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-26-intel
    timeout-minutes: 20
    permissions:
      actions: read # Download only this workflow run's build artifact.
      contents: read # Read full tag history and protected main ancestry.
    outputs:
      verified-artifact-name: verified-${{ needs.build-release.outputs.artifact-name }}
      version: ${{ needs.build-release.outputs.version }}
      tag-object: ${{ steps.tag_evidence.outputs.object }}
      tag-commit: ${{ steps.tag_evidence.outputs.commit }}
    steps:
      - name: Checkout full tag history
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require annotated main-ancestor tag
        id: tag_evidence
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/tags/v* ]]
          [[ "$(git cat-file -t "$GITHUB_REF")" == "tag" ]]
          tag_object=$(git rev-parse "$GITHUB_REF")
          tag_commit=$(git rev-parse "$GITHUB_REF^{commit}")
          [[ "$(git rev-parse HEAD)" == "$tag_commit" ]]
          [[ "$EXPECTED_SHA" == "$tag_object" || "$EXPECTED_SHA" == "$tag_commit" ]]
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$tag_commit" refs/remotes/origin/main
          echo "object=$tag_object" >> "$GITHUB_OUTPUT"
          echo "commit=$tag_commit" >> "$GITHUB_OUTPUT"
      - name: Download this workflow build artifact
        # actions/download-artifact v8.0.1
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ needs.build-release.outputs.artifact-name }}
          path: build/release
      - name: Reverify release, manifest, provenance, and SBOM
        env:
          RELEASE_VERSION: ${{ needs.build-release.outputs.version }}
        run: |
          release_timestamp=$(git show -s --format=%cI "$GITHUB_REF^{commit}")
          ./tools/verify_release_artifacts.sh \
            "$RELEASE_VERSION" "$release_timestamp" build/release
      - name: Upload verified release artifact
        # actions/upload-artifact v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: verified-${{ needs.build-release.outputs.artifact-name }}
          retention-days: 1
          path: |
            build/release/WormsWMD-macOS-Fix-*.zip
            build/release/WormsWMD-macOS-Fix-*.zip.sha256
            build/release/WormsWMD-macOS-Fix-*.cdx.json
            build/release/RELEASE_NOTES.md

  publish-release:
    name: Publish verified tagged release
    needs: verify-release
    if: startsWith(github.ref, 'refs/tags/v')
    environment: release
    runs-on: macos-26-intel
    timeout-minutes: 15
    permissions:
      actions: read # Download only this workflow run's verified artifact.
      contents: write # Create or resume the exact tagged GitHub release.
      id-token: write # Request the short-lived attestation identity token.
      attestations: write # Publish verified release attestations.
      artifact-metadata: write # Record release metadata with attestations.
    steps:
      - name: Require protected release environment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          environment_json="$RUNNER_TEMP/release-environment.json"
          gh api "repos/$GITHUB_REPOSITORY/environments/release" \
            > "$environment_json"
          /usr/bin/python3 - "$environment_json" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              environment = json.load(handle)
          rules = environment.get("protection_rules", [])
          reviewer_rules = [
              rule for rule in rules if rule.get("type") == "required_reviewers"
          ]
          if len(reviewer_rules) != 1:
              raise SystemExit("release environment requires one reviewer rule")
          rule = reviewer_rules[0]
          if not rule.get("reviewers"):
              raise SystemExit("release environment must require a reviewer")
          PY
      - name: Download verified artifact from this workflow
        # actions/download-artifact v8.0.1
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ needs.verify-release.outputs.verified-artifact-name }}
          path: build/release
      - name: Check verified artifact checksum
        env:
          RELEASE_VERSION: ${{ needs.verify-release.outputs.version }}
        run: |
          set -euo pipefail
          release_checksum="WormsWMD-macOS-Fix-${RELEASE_VERSION}.zip.sha256"
          (cd build/release && shasum -a 256 -c "$release_checksum")
          [[ -f build/release/RELEASE_NOTES.md ]]
          [[ -f "build/release/WormsWMD-macOS-Fix-${RELEASE_VERSION}.cdx.json" ]]
      - name: Attest verified release assets
        # actions/attest v4.2.2
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: |
            build/release/WormsWMD-macOS-Fix-*.zip
            build/release/WormsWMD-macOS-Fix-*.zip.sha256
      - name: Attest verified release SBOM
        # actions/attest v4.2.2
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: build/release/WormsWMD-macOS-Fix-*.zip
          sbom-path: build/release/WormsWMD-macOS-Fix-*.cdx.json

      - name: Publish GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_TAG_OBJECT: ${{ needs.verify-release.outputs.tag-object }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            if [[ "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq '.isDraft')" != "true" ]]; then
              echo "::error::Refusing to overwrite published release $GITHUB_REF_NAME."
              exit 1
            fi
            gh release edit "$GITHUB_REF_NAME" --notes-file build/release/RELEASE_NOTES.md
          else
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
              --notes-file build/release/RELEASE_NOTES.md
          fi
          gh release upload "$GITHUB_REF_NAME" \
            build/release/*.zip \
            build/release/*.zip.sha256 \
            build/release/*.cdx.json \
            --clobber
          expected_assets="$RUNNER_TEMP/expected-release-assets"
          actual_assets="$RUNNER_TEMP/actual-release-assets"
          printf '%s\n' \
            "WormsWMD-macOS-Fix-${GITHUB_REF_NAME}.zip" \
            "WormsWMD-macOS-Fix-${GITHUB_REF_NAME}.zip.sha256" \
            "WormsWMD-macOS-Fix-${GITHUB_REF_NAME}.cdx.json" \
            | LC_ALL=C sort > "$expected_assets"
          gh release view "$GITHUB_REF_NAME" --json assets \
            --jq '.assets[].name' | LC_ALL=C sort > "$actual_assets"
          if ! cmp -s "$expected_assets" "$actual_assets"; then
            echo "::error::Unexpected release asset; refusing publication."
            exit 1
          fi
          current_tag_object=$(gh api \
            "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" \
            --jq '.object.sha')
          if [[ "$current_tag_object" != "$EXPECTED_TAG_OBJECT" ]]; then
            echo "::error::Tag moved after verification; refusing publication."
            exit 1
          fi
          gh release edit "$GITHUB_REF_NAME" --draft=false
