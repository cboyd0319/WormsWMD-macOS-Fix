name: Release Bundle

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-release:
    name: Build release bundle
    runs-on: macos-latest

    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Make scripts executable
        run: chmod +x fix_worms_wmd.sh install.sh "Install Fix.command" "Worms W.M.D Fix.command" scripts/*.sh tools/*.sh

      - name: Validate harness
        run: ./tools/validate_harness.sh

      - name: Check bash syntax
        run: |
          for script in fix_worms_wmd.sh install.sh "Install Fix.command" "Worms W.M.D Fix.command" scripts/*.sh tools/*.sh; do
            bash -n "$script"
          done

      - name: Check Qt package
        run: ./scripts/download_qt_frameworks.sh --check

      - name: Build release zip
        run: ./tools/build_release_bundle.sh --version "${GITHUB_REF_NAME:-manual}"

      - name: Attest release assets
        uses: actions/attest@v4
        with:
          subject-path: |
            build/release/WormsWMD-macOS-Fix-*.zip
            build/release/WormsWMD-macOS-Fix-*.zip.sha256

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: WormsWMD-macOS-Fix-${{ github.ref_name || 'manual' }}
          path: |
            build/release/WormsWMD-macOS-Fix-*.zip
            build/release/WormsWMD-macOS-Fix-*.zip.sha256

      - name: Publish GitHub release assets
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" build/release/*.zip build/release/*.zip.sha256 --clobber
          else
            gh release create "$GITHUB_REF_NAME" build/release/*.zip build/release/*.zip.sha256 --verify-tag --generate-notes
          fi
