name: Request Codex review

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, ready_for_review, edited]
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions: {}

concurrency:
  # Ignored edits must not replace pending eligible requests in GitHub's queue.
  group: codex-review-${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number }}-${{ github.event_name == 'pull_request_target' && github.event.action == 'edited' && !github.event.changes.base && 'metadata' || 'review' }}
  cancel-in-progress: false

jobs:
  request-review:
    # Dependabot's PR-trigger credentials are restricted; CI completion uses the trusted default branch.
    if: >-
      (github.event_name == 'pull_request_target' &&
       github.event.pull_request.draft == false && github.event.pull_request.base.ref == 'main' &&
       (github.event.action != 'edited' || github.event.changes.base) &&
       (github.event.sender.id != 49699333 || github.event.pull_request.user.id != 49699333)) ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request' &&
       github.event.workflow_run.actor.id == 49699333 &&
       github.event.workflow_run.pull_requests[0].base.ref == 'main')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      # Trusted base only: a repository-scoped user token posts as a Codex-linked user.
      # No checkout, PR code, artifacts, or credential output.
      - name: Request one review for the current ready PR revision
        # actions/github-script v8.0.0
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          github-token: ${{ secrets.CODEX_REVIEW_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const { action, changes, workflow_run: upstream } = context.payload;
            const fallback = context.eventName === 'workflow_run';
            const dependabotID = 49699333;
            let number;
            if (fallback) {
              if (upstream?.name !== 'CI' || upstream.event !== 'pull_request' ||
                  upstream.status !== 'completed' || upstream.actor?.id !== dependabotID ||
                  upstream.head_repository?.full_name !== `${owner}/${repo}` ||
                  !Array.isArray(upstream.pull_requests) || upstream.pull_requests.length !== 1 ||
                  upstream.pull_requests[0].base?.ref !== 'main') return;
              number = upstream.pull_requests[0].number;
            } else if (context.eventName === 'pull_request_target') {
              if (!['opened', 'reopened', 'ready_for_review', 'edited'].includes(action) ||
                  (action === 'edited' && !changes?.base)) return;
              number = context.payload.number;
            } else return;
            if (!Number.isSafeInteger(number) || number < 1) throw new Error('Invalid PR number');
            const ready = pr => pr.state === 'open' && pr.draft === false && pr.base.ref === 'main' &&
              (!fallback || (pr.user?.id === dependabotID && pr.head.repo?.full_name === `${owner}/${repo}`));
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: number });
            if (!ready(pr)) return;
            const { data: reviewer } = await github.rest.users.getAuthenticated();
            if (reviewer.type !== 'User' || !Number.isSafeInteger(reviewer.id)) {
              throw new Error('Use a repository-scoped user token connected to Codex');
            }
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: number, per_page: 100,
            });
            const { data: latest } = await github.rest.pulls.get({ owner, repo, pull_number: number });
            if (!ready(latest)) return;
            if (!/^[a-f0-9]{40}$/.test(latest.head.sha)) throw new Error('Invalid PR revision');
            const marker = `<!-- codex-auto-review:${number}:${latest.head.sha} -->`;
            if (comments.some(comment => comment.user?.id === reviewer.id &&
                comment.user.type === 'User' && comment.body?.includes(marker))) {
              core.info('Review already requested for this revision.');
              return;
            }
            await github.rest.issues.createComment({
              owner, repo, issue_number: number, body: `@codex review\n\n${marker}`,
            });
